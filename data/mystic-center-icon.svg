<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2a4a"/>
      <stop offset="0.55" stop-color="#122036"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4c8dff"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#b9dcff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.15" r="0.8">
      <stop offset="0" stop-color="#4c8dff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#4c8dff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#bg)"/>
  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#glow)"/>
  <rect x="5.5" y="5.5" width="117" height="117" rx="28.5" fill="none"
        stroke="url(#edge)" stroke-opacity="0.55" stroke-width="1.5"/>

  <!-- stylised M: three control-center rails converging -->
  <path d="M34 92 V40 L64 70 L94 40 V92"
        fill="none" stroke="url(#mark)" stroke-width="11"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- circuit nodes -->
  <circle cx="34" cy="99" r="5" fill="#22d3ee"/>
  <circle cx="94" cy="99" r="5" fill="#4c8dff"/>
  <circle cx="64" cy="28" r="4.5" fill="#ffffff" fill-opacity="0.9"/>
</svg>
