name: release-notes

on:
  push:
    branches: [main]
    paths: ['.github/releases/*.md']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync curated release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          for f in .github/releases/*.md; do
            tag=$(basename "$f" .md)
            if gh release view "$tag" >/dev/null 2>&1; then
              gh release edit "$tag" --notes-file "$f"
              echo "updated release $tag from $f"
            else
              echo "release $tag does not exist yet (notes file kept for its first build)"
            fi
          done