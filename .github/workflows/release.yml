name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and attach the Arch package to'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  arch-package:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
      - name: Install tooling
        run: pacman -Sy --noconfirm --needed git curl zstd pacman-contrib github-cli
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Build Arch package
        run: |
          # makepkg refuses to run as root; build as an unprivileged user
          useradd -m builder
          chown -R builder:builder .
          sed -i 's|^#PACKAGER=.*|PACKAGER="Krishna Dave <krishna.dave0607@gmail.com>"|' /etc/makepkg.conf
          su - builder -c "cd \"$PWD/packaging/aur\" && updpkgsums && makepkg -f --nodeps --noconfirm"
          cp packaging/aur/*.pkg.tar.zst .
          sha256sum *.pkg.tar.zst > sha256sums.txt
          cat sha256sums.txt
      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: ${{ inputs.tag || github.ref_name }}
          fail_on_unmatched_files: true
          body: |
            MSI Center for Windows, ported to Linux for the **MSI Crosshair 16 HX D14VFKG (MS-15P2)**.

            ### Install

            **Arch Linux** — package attached below:

            ```bash
            sudo pacman -U mystic-center-*.pkg.tar.zst
            sudo systemctl enable --now mystic-center.service
            ```

            Log out and back in once so the udev ACL grants your session access to the keyboard.

            **Any distro** — from source:

            ```bash
            git clone https://github.com/Krishna0607/Mystic-Center.git
            cd Mystic-Center
            ./install.sh
            sudo ./install.sh --system
            ```

            Requirements: kernel `msi-ec` or `msi_wmi_platform`, `ec_sys write_support=1`, `wheel` group, hidraw RGB device, optional `nvidia-smi` — full checklist in the [README](https://github.com/Krishna0607/Mystic-Center#requirements).

            **Full changelog:** https://github.com/Krishna0607/Mystic-Center/commits/${{ inputs.tag || github.ref_name }}
          files: |
            *.pkg.tar.zst
            sha256sums.txt
      - name: Apply curated release notes if present
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          if [ -f ".github/releases/$tag.md" ]; then
            gh release edit "$tag" --notes-file ".github/releases/$tag.md"
            echo "applied curated notes for $tag"
          else
            echo "no .github/releases/$tag.md, keeping the default notes"
          fi
